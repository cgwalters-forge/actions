name: lint
description: actionlint, zizmor and a runner-label policy over the calling repository's workflows
inputs:
  deny:
    description: Runner labels to deny besides ubuntu-latest, separated by whitespace or commas
    default: ""
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: just@1.58.0
    - name: lint
      shell: bash
      env:
        RUNNER_LABELS_DENY: ${{ inputs.deny }}
        # For zizmor's online audits (Justfile).
        GH_TOKEN: ${{ github.token }}
      run: just --justfile "$GITHUB_ACTION_PATH/Justfile" --working-directory . check
