[package]
name = "action-scripts"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rustix = { version = "1", features = ["fs", "process"] }
serde_json = "1"
tempfile = "3"
