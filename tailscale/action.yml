name: Tailscale
description: >-
  Join the tailnet with tailscale/github-action, then make tailscaled's
  LocalAPI socket root's only, so that other local users can't use the
  node's tailnet access.
inputs:
  oauth-client-id:
    description: >-
      Client ID of the Tailscale OIDC federated identity, the login this
      action passes on without `authkey` (the job needs id-token write
      permission).
    required: false
    default: ""
  authkey:
    description: >-
      A single-use key that `mint` made in an earlier job, to join with in
      place of the federated login, in a job with no identity token. The
      key carries its tags.
    required: false
    default: ""
  mint:
    description: >-
      `true` to mint, after the federated join, a single-use, ephemeral
      and preauthorized key with the same tags, valid for an hour, as the
      `key` output: for a later job's `authkey`. Refused with `authkey`
      and with step debug logging on.
    required: false
    default: "false"
  audience:
    description: Audience of the OIDC federated identity.
    required: false
    default: ""
  tags:
    description: Comma-separated tags for the node.
    required: false
    default: ""
  hostname:
    description: Node name; empty for tailscale/github-action's default, from the runner name.
    required: false
    default: ""
  statedir:
    description: >-
      Directory for tailscaled's state, root's only; empty keeps it in memory.
      A node that serves HTTPS needs one, since Tailscale makes and keeps its
      certificate there.
    required: false
    default: ''
  args:
    description: Additional arguments to `tailscale up`; DNS acceptance is always disabled.
    required: false
    default: ""
  proxy:
    description: Inference proxy URL; empty uses the organization's lookaside setting.
    required: false
    default: ""
  check:
    description: Report granted scopes and verify the proxy returns unauthenticated HTTP 401.
    required: false
    default: "false"
outputs:
  proxy:
    description: Inference proxy URL for the calling workflow.
    value: ${{ steps.settings.outputs.proxy }}
  key:
    description: >-
      With `mint`, the key for a later job's `authkey`. Pass it on only as
      a secret of a reusable workflow call, which masks it in that job's log.
    value: ${{ steps.mint.outputs.key }}
runs:
  using: composite
  steps:
    # Before anything is installed or any credential requested.
    - name: Check the login inputs
      shell: bash
      env:
        AUTHKEY: ${{ inputs.authkey }}
        MINT: ${{ inputs.mint }}
      run: |
        case "$MINT" in true | false) ;; *) echo "::error::mint must be true or false"; exit 1 ;; esac
        if test -n "$AUTHKEY" && test "$MINT" = true; then
          echo "::error::mint needs the federated login, not authkey"; exit 1
        fi
    - name: Choose organization settings
      id: settings
      shell: bash
      env:
        REPOSITORY_OWNER: ${{ github.repository_owner }}
        OAUTH_CLIENT_ID: ${{ inputs.oauth-client-id }}
        AUDIENCE: ${{ inputs.audience }}
        TAGS: ${{ inputs.tags }}
        PROXY: ${{ inputs.proxy }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/setup.mjs"
    # Upstream makes the state directory as the runner's user; root makes it
    # first, root's only, since it holds the node key and any certificate.
    - name: Make tailscaled's state directory root's only
      if: inputs.statedir != ''
      shell: bash
      env:
        STATEDIR: ${{ inputs.statedir }}
      run: sudo install -d -m 0700 -o root -g root "$STATEDIR"
    # tailscale/github-action installs into /usr/local/bin and runs `sudo
    # tailscale up`; RHEL's sudo secure_path leaves /usr/local/bin out, and
    # tailscaled needs iptables, which RHEL 10 runners don't have. The links
    # dangle until the join installs the binaries. Elsewhere nothing runs.
    - name: Install RHEL prerequisites
      shell: bash
      env:
        OS_RELEASE: /etc/os-release
      run: |
        if ! test -r "$OS_RELEASE"; then exit 0; fi
        # shellcheck source=/dev/null
        release=$(. "$OS_RELEASE" && echo "${ID:-} ${VERSION_ID:-}")
        case "$release" in
          "rhel 10" | "rhel 10."*) ;;
          *) exit 0 ;;
        esac
        sudo dnf install -y iptables
        sudo ln -sfn /usr/local/bin/tailscale /usr/bin/tailscale
        sudo ln -sfn /usr/local/bin/tailscaled /usr/bin/tailscaled
    - name: Connect to the tailnet
      id: join
      uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
      # With authkey, only the key: it carries its tags, and the
      # federated login would take precedence over it.
      with:
        authkey: ${{ inputs.authkey }}
        oauth-client-id: ${{ inputs.authkey == '' && steps.settings.outputs.oauth-client-id || '' }}
        audience: ${{ inputs.authkey == '' && steps.settings.outputs.audience || '' }}
        tags: ${{ inputs.authkey == '' && steps.settings.outputs.tags || '' }}
        hostname: ${{ inputs.hostname }}
        args: ${{ inputs.args }} --accept-dns=false
        statedir: ${{ inputs.statedir }}
    # The LocalAPI socket is 0666 and doesn't check who dials through it:
    # with it, any local user could `tailscale nc` to every node the tags
    # allow, as this node, and list the tailnet with `tailscale status`.
    # tailscaled leaves an existing directory's mode alone on restart.
    # Also when joining failed: tailscaled may be running anyway, and a
    # caller's continue-on-error would go on with its socket open.
    - name: Make tailscaled's LocalAPI root's only
      if: always()
      shell: bash
      env:
        JOINED: ${{ steps.join.outcome == 'success' }}
      run: |
        # Upstream's post hook skips cleanup when its CLI is inaccessible.
        # The ephemeral, in-memory node disappears after runner teardown.
        if sudo test -f /usr/local/bin/tailscale; then sudo chmod 0700 /usr/local/bin/tailscale; fi
        if ! sudo test -d /var/run/tailscale; then echo "tailscaled is not running"; exit 0; fi
        sudo chmod 0700 /var/run/tailscale
        echo "/var/run/tailscale: $(sudo stat -c '%a %U:%G' /var/run/tailscale)"
        # root still gets through (by path: RHEL's sudo has no /usr/local/bin in its PATH).
        if test "$JOINED" = true; then sudo /usr/local/bin/tailscale status --self >/dev/null; fi
    # After the join, so that a key is minted only for a login that works.
    - name: Mint a key for a later job
      id: mint
      if: inputs.mint == 'true'
      shell: bash
      env:
        AUDIENCE: ${{ steps.settings.outputs.audience }}
        OAUTH_CLIENT_ID: ${{ steps.settings.outputs.oauth-client-id }}
        TAGS: ${{ steps.settings.outputs.tags }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/mint.mjs"
    - name: Check tailnet identity and proxy
      if: inputs.check == 'true'
      shell: bash
      env:
        AUDIENCE: ${{ steps.settings.outputs.audience }}
        OAUTH_CLIENT_ID: ${{ steps.settings.outputs.oauth-client-id }}
        PROXY: ${{ steps.settings.outputs.proxy }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/check.mjs"
