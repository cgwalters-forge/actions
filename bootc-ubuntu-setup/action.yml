name: 'Bootc Ubuntu Setup'
description: 'Default host setup'
inputs:
  libvirt:
    description: 'Install libvirt and virtualization stack'
    required: false
    default: 'false'
outputs:
  host-os:
    description: >-
      The runner's OS as ID-VERSION_ID from os-release (e.g. ubuntu-24.04),
      read before this action installs anything. On 24.04 the packages
      installed here upgrade base-files, so os-release reports a newer
      release afterwards; branch on this instead.
    value: ${{ steps.host.outputs.idv }}
runs:
  using: 'composite'
  steps:
    # On 24.04 the packages below pull in a newer libc6, which in turn
    # upgrades base-files and with it /usr/lib/os-release. Detect the host
    # once, before anything is installed, and have later steps use that.
    - name: Detect host OS
      id: host
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        . /usr/lib/os-release
        echo "idv=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"
    # The default runners have TONS of crud on them...
    - name: Free up disk space on runner
      shell: bash
      run: |
        set -xeuo pipefail
        sudo df -h
        # Use globs for package patterns (apt and dpkg both support fnmatch globs)
        unwanted_pkgs=('aspnetcore-*' 'dotnet-*' 'llvm-*' 'php*' 'mongodb-*' 'mysql-*'
                       azure-cli google-chrome-stable firefox mono-devel)
        unwanted_dirs=(/usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL)
        # Start background removal operations as systemd units; if this causes
        # races in the future around disk space we can look at waiting for cleanup
        # before starting further jobs, but right now we spent a lot of time waiting
        # on the network and scripts and such below, giving these plenty of time to run.
        n=0
        runcleanup() {
          sudo systemd-run -r -u action-cleanup-${n} -- "$@"
          n=$(($n + 1))
        }
        runcleanup docker image prune --all --force
        for x in ${unwanted_dirs[@]}; do
          runcleanup rm -rf "$x"
        done
        # Apt removals in foreground, as we can't parallelize these.
        # Only attempt removal if matching packages are installed.
        for x in ${unwanted_pkgs[@]}; do
          if dpkg -l "$x" >/dev/null 2>&1; then
            /bin/time -f '%E %C' sudo apt-get remove -y "$x"
          fi
        done
    # We really want support for heredocs
    - name: Install required packages
      shell: bash
      env:
        IDV: ${{ steps.host.outputs.idv }}
      run: |
        set -eux
        case "${IDV}" in
          ubuntu-24.04)
            # 24.04's podman is too old (no heredoc support, manifest bugs),
            # so take the container stack from resolute (26.04), the same
            # series 26.04 runners install natively (though they also get
            # its -updates). Plucky's (25.04) podman
            # and buildah are built with go1.24.1, which intermittently
            # segfaults on thread exit on the runners' 6.11+ kernels
            # (https://github.com/golang/go/issues/73141, fixed in go1.24.3);
            # a podman build RUN step then fails with exit status 139.
            #
            # Plucky stays enabled at the default priority: it still supplies
            # the newer libvirt stack (libvirt, OVMF, virtiofsd) below, and
            # anything else consumers install later.
            #
            # Historically we pointed straight at
            # azure.archive.ubuntu.com, but that single Azure-regional mirror suffers
            # chronic connection timeouts on GitHub Actions runners. This is a
            # widespread, long-standing issue, not specific to us:
            # https://github.com/actions/runner-images/issues/7048
            # https://github.com/actions/runner-images/issues/12949
            # https://github.com/orgs/community/discussions/205332
            # A plain http(s) URL is a single endpoint as far as apt is concerned: if
            # it's unreachable, apt just retries the *same* host rather than trying an
            # alternative (only the mirror:/mirror+file: URI scheme gives apt genuine
            # client-side fallback across multiple mirrors, per sources.list(5)). So
            # reuse the mirrorlist-with-fallback that Ubuntu's own cloud-init already
            # sets up for the base OS sources on these runners (Azure mirror first,
            # falling back to the global archive), instead of hardcoding one host with
            # no fallback at all. Fall back to the plain global archive if that
            # mirrorlist isn't present, e.g. on a non-standard runner.
            # Non-amd64 architectures (e.g. arm64) use ports.ubuntu.com/ubuntu-ports,
            # which isn't affected by this since it has no azure-specific variant.
            if [ "$(dpkg --print-architecture)" = "amd64" ]; then
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                mirror="mirror+file:/etc/apt/apt-mirrors.txt"
              else
                mirror="http://archive.ubuntu.com/ubuntu"
              fi
            else
              mirror="http://ports.ubuntu.com/ubuntu-ports"
            fi
            echo "deb ${mirror} plucky universe main" | sudo tee /etc/apt/sources.list.d/plucky.list
            # Only resolute's release pocket, deliberately without -updates
            # or -security, as with plucky: the versions installed here then
            # only change when this file does, which keeps CI reproducible.
            # The flip side is that resolute fixes arrive only when someone
            # points this elsewhere.
            echo "deb ${mirror} resolute main universe" | sudo tee /etc/apt/sources.list.d/resolute.list
            # Keep resolute below the normal candidate for every package, so
            # it is only used where we explicitly ask for it with -t resolute
            # (here, and for QEMU below).
            printf '%s\n' \
              'Package: *' \
              'Pin: release n=resolute' \
              'Pin-Priority: 50' | sudo tee /etc/apt/preferences.d/resolute
            # Raise apt retries slightly above the compiled-in default of 3 to tolerate
            # transient network blips (covers ~2-3 min of cumulative retry delay with
            # apt's exponential backoff, capped at 30s/attempt). This used to be set to
            # 35 (~15 min) specifically to ride out azure.archive.ubuntu.com outages;
            # now that we no longer use that mirror, a much smaller value suffices.
            echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
            # The resolute closure below upgrades libc6, after which
            # needrestart would restart most host services (journald,
            # rsyslog, containerd, ...) in the middle of the job; rsyslog
            # has been seen to crash doing so. Only list them instead. A
            # config file rather than NEEDRESTART_SUSPEND on each apt call,
            # so that it also covers the libvirt step and later installs by
            # consumers.
            sudo mkdir -p /etc/needrestart/conf.d
            echo "\$nrconf{restart} = 'l';" | sudo tee /etc/needrestart/conf.d/90-bootc-ubuntu-setup.conf
            /bin/time -f '%E %C' sudo apt update
            # -t resolute resolves the dependency closure from resolute too;
            # that includes libc6 2.43, which also upgrades base-files, so
            # /usr/lib/os-release reports 26.04 afterwards (see the "Detect
            # host OS" step). Recommends are skipped because they would drag
            # in e.g. resolute's python3 (via criu); passt (the default
            # rootless network backend) and catatonit (podman run --init)
            # are the ones worth having. conmon, netavark and aardvark-dns
            # are listed explicitly because podman's dependencies on them
            # are already satisfied by noble's much older versions.
            /bin/time -f '%E %C' sudo apt-get -t resolute install -y --no-install-recommends \
              crun buildah podman skopeo conmon netavark aardvark-dns passt catatonit just
            ;;
          ubuntu-26.04)
            # 26.04 ships a sufficiently modern podman with heredoc support;
            # no PPA or package upgrades needed — just install extras.
            /bin/time -f '%E %C' sudo apt update
            /bin/time -f '%E %C' sudo apt install -y just
            ;;
          *)
            echo "Unsupported runner: ${IDV}" >&2
            exit 1
            ;;
        esac
    # This is the default on e.g. Fedora derivatives, but not Debian.
    # Only needed when libvirt/virtualization is requested.
    - name: Enable unprivileged /dev/kvm access
      if: ${{ inputs.libvirt == 'true' }}
      shell: bash
      run: |
        set -xeuo pipefail
        if [ -c /dev/kvm ]; then
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
        else
          printf 'No /dev/kvm character device; skipping KVM permission setup.\n'
        fi
    # Used by a few workflows, but generally useful
    - name: Set architecture variable
      id: set_arch
      shell: bash
      run: echo "ARCH=$(arch)" >> $GITHUB_ENV
    # Install libvirt stack if requested
    - name: Install libvirt and virtualization stack
      if: ${{ inputs.libvirt == 'true' }}
      shell: bash
      env:
        IDV: ${{ steps.host.outputs.idv }}
      run: |
        set -xeuo pipefail
        firmware_packages=()
        if [ "$IDV" = ubuntu-26.04 ]; then
          # Unsealed bootc tests request bcvk's uefi-insecure mode:
          # https://github.com/bootc-dev/bootc/blob/12f03a042b868f40ec850c2496babda1d66775d5/crates/xtask/src/bcvk.rs#L113-L120
          # This becomes a libvirt secure=no firmware request. Resolute's
          # stateless AMD-SEV descriptor satisfies that request and may win
          # auto-selection, but without NVRAM it cannot restore the installed
          # GRUB boot entry. Keep generic OVMF and the other recommendations
          # while removing that descriptor by excluding its package.
          # https://libvirt.org/formatdomain.html#guest-firmware
          firmware_packages=(ovmf-generic ovmf-amdsev-)
        fi
        # Let libvirt select its QEMU dependency; qemu-kvm has ambiguous
        # providers on Ubuntu 26.04 when requested explicitly.
        # see https://github.com/bootc-dev/bcvk/issues/176
        /bin/time -f '%E %C' sudo apt install -y libkrb5-dev pkg-config libvirt-dev genisoimage qemu-utils virtiofsd libvirt-daemon-system python3-virt-firmware "${firmware_packages[@]}"

    # bcvk requires KVM and v0.19.0 has no arm64 release asset.
    - name: Install bcvk
      if: ${{ inputs.libvirt == 'true' && runner.arch == 'X64' }}
      shell: bash
      run: |
        set -xeuo pipefail
        # renovate: datasource=github-releases depName=bootc-dev/bcvk
        export BCVK_VERSION=0.19.0
        # Something in the stack is overriding this, but we want session right now for bcvk
        echo LIBVIRT_DEFAULT_URI=qemu:///session >> $GITHUB_ENV
        td=$(mktemp -d)
        cd $td
        # Install bcvk
        target=bcvk-$(arch)-unknown-linux-gnu
        /bin/time -f '%E %C' curl --fail --show-error --location --retry 35 --retry-delay 30 --retry-max-time 1200 --output "${target}.tar.gz" "https://github.com/bootc-dev/bcvk/releases/download/v${BCVK_VERSION}/${target}.tar.gz"
        tar xzf "${target}.tar.gz"
        sudo install -T "${target}" /usr/bin/bcvk
        cd -
        rm -rf "$td"

        # Also bump the default fd limit as a workaround for https://github.com/bootc-dev/bcvk/issues/65
        sudo sed -i -e 's,^\* hard nofile 65536,* hard nofile 524288,' /etc/security/limits.conf
    # Ubuntu 24.04's QEMU loses virtiofs IRQ notifications.  Use the fixed
    # package from Resolute on Ubuntu 24.04 for the disposable CI host; the
    # Ubuntu 26.04 setup may provide its own native stack.  This is the same
    # race investigated in https://github.com/bootc-dev/bootc/pull/2290:
    # https://github.com/qemu/qemu/commit/1ba9a5220325dd5260a0c37b6299ce38364a5120
    - name: Install fixed QEMU from Ubuntu Resolute
      if: ${{ inputs.libvirt == 'true' }}
      shell: bash
      env:
        IDV: ${{ steps.host.outputs.idv }}
      run: |
        set -xeuo pipefail
        if [ "$IDV" != ubuntu-24.04 ]; then
          printf 'Skipping Resolute QEMU setup on %s\n' "$IDV"
          exit 0
        fi
        case "$(dpkg --print-architecture)" in
          amd64)
            qemu_package=qemu-system-x86
            ;;
          arm64)
            qemu_package=qemu-system-arm
            ;;
          *)
            printf 'Unsupported architecture for Resolute QEMU: %s\n' \
              "$(dpkg --print-architecture)" >&2
            exit 1
            ;;
        esac
        qemu_binary="qemu-system-$(uname -m)"

        # The resolute source and its low-priority pin were set up with the
        # container stack above. The explicitly requested QEMU packages
        # still bring their dependency closure; that is acceptable on this
        # disposable CI runner; copying just the executable would leave its
        # runtime libraries behind.
        # Keep ipxe-qemu in this explicit target transaction: its ROM must
        # match the QEMU userspace rather than the older package from Plucky.
        timeout --foreground --signal=TERM --kill-after=30s 5m \
          sudo apt-get -t resolute install -y --no-install-recommends \
            "$qemu_package" qemu-system-common qemu-system-data qemu-utils ipxe-qemu

        printf 'Selected QEMU: %s\n' "$qemu_binary"
        "$qemu_binary" --version
        dpkg-query -W -f='${binary:Package} ${Version}\n' \
          "$qemu_package" qemu-system-common qemu-system-data qemu-utils ipxe-qemu
        rom=
        if [ "$(dpkg --print-architecture)" = amd64 ]; then
          rom_names=(efi-virtio.rom)
        else
          rom_names=(efi-aa64.rom efi-virtio.rom)
        fi
        for rom_name in "${rom_names[@]}"; do
          for candidate in "/usr/share/qemu/$rom_name" "/usr/lib/ipxe/qemu/$rom_name"; do
            if [ -f "$candidate" ]; then
              rom=$candidate
              break
            fi
          done
          [ -n "$rom" ] && break
        done
        if [ -n "$rom" ]; then
          printf 'EFI ROM: %s (%s)\n' "$rom" "$(dpkg-query -S "$rom")"
          sha256sum "$rom"
        else
          printf 'No expected EFI ROM found after installing ipxe-qemu\n' >&2
          exit 1
        fi
    - name: Keep CI bwrap children in the parent AppArmor profile
      shell: bash
      run: |
        if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
           sudo test -r /sys/kernel/security/apparmor/profiles &&
           sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
          sudo tee /etc/apparmor.d/local/bwrap-userns-restrict >/dev/null <<'EOF'
        priority=100 allow file rwlkm /**,
        priority=100 allow ix /**,
        EOF
          sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        fi
    - name: Cleanup status
      shell: bash
      run: |
        set -xeuo pipefail
        systemctl list-units 'action-cleanup*'
        df -h
