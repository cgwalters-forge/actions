# secure-host's contract (secure-host/README.md) as plain CI, with no
# agent: a build job that runs the tests and holds nothing worth stealing,
# and a publish job that runs nothing of the build job's and takes its
# output by artifact ID and digest, as data. Each job runs secure-host
# before anything it does not trust and nothing with root after it, the
# job shape workflows-check's shape check asks of every repository.
#
# It names secure-host by a commit, as a caller outside this repository
# would, so it shows a released revision working, not this one: that is
# secure-host.yml's job. It names it as agentic-job's secure-host, which
# forwards to this repository's at a commit agentic-job pins, because that
# is the only secure-host the pinned shape check (lint/shape-check.yml)
# admits, and only with no inputs: so the build job runs without
# `egress: write-policy` until a shape check admits this repository's
# action with it. Nothing moves the pin (Dependabot does not follow our
# own actions); move it by hand after agentic-job moves its forward.
#
# The shape check asks for secure-host in every job, publish included;
# publish here holds no secret. One that did must not run on
# pull_request, where this revision's recipes are the author's.
name: example-plain-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      id: ${{ steps.up.outputs.artifact-id }}
      digest: ${{ steps.up.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cgwalters-forge/agentic-job/secure-host@12f8900e4899203ad0c5d020f948219fc8974a65 # main on 2026-10-22
      # The runner's user from here on: no root and no metadata service.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.58.0
      - run: just test-secure-host
      - run: just example-build out
      - id: up
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # This revision's recipes; nothing the build job made is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cgwalters-forge/agentic-job/secure-host@12f8900e4899203ad0c5d020f948219fc8974a65 # main on 2026-10-22
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.58.0
      - name: The artifact has the build job's digest
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.build.outputs.id }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: just example-verify-digest
      # download-artifact refuses bytes that do not match the digest.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.id }}
          path: out
      - run: just example-validate out
