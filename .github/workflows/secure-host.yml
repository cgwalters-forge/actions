# secure-host against its pinned image: the two-job contract of its
# README, its inputs, and the world-write policy at run time. Each job
# runs code as root before the action, on a fresh VM, with a read-only
# token and no secrets. Host checks are Justfile recipes; `before` ones
# are positive controls for the `after` ones.
name: secure-host

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercise the wrappers' agent job, cgwalters-agent.yml, on a fresh VM:
  # prepare, agentic-job's runner-user admission, config --host and the
  # pinned forwarder, then the setup script and run's own proof that the
  # host is secured, all as the runner's user. No inference, tailnet
  # credentials or agent uploads.
  wrapper-policy:
    permissions:
      actions: read
      contents: read
    uses: cgwalters-forge/agentic-job/.github/workflows/policy.yml@427ce2295925654be9c35e91ca5cee91bbc2c9ea # build-e9bea055d71d86a461b8956e1e550398f8a8253d32539b253969bf6f17527a9d
    with:
      id: wrapper-smoke
      runner: '"ubuntu-26.04"'
      repo: cgwalters-forge/actions
      allow: workflow/review.toml
      kind: analysis
      outputs: noop
      max-outputs: '1'
      max-requests: '0'
      budget: '1'
      task: Prove the agent job's host is secured for the runner's user.
      config: .agentic-job-source/secure-host/hosted.toml
      artifact-prefix: wrapper-smoke-

  wrapper-runner:
    needs: wrapper-policy
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/agentic-job
          ref: 427ce2295925654be9c35e91ca5cee91bbc2c9ea # build-e9bea055d71d86a461b8956e1e550398f8a8253d32539b253969bf6f17527a9d
          path: .agentic-job-source
          persist-credentials: false
      - uses: ./.agentic-job-source/prepare
        with:
          binary-artifact-id: ${{ needs.wrapper-policy.outputs.binary-artifact-id }}
          policy-artifact-id: ${{ needs.wrapper-policy.outputs.policy-artifact-id }}
      - name: Admit the runner-user configuration
        env:
          CALLER_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          AGENT_USER: runner
        run: python3 .agentic-job-source/workflow/runner-setup.py admit
      - name: Check inference proxy reachability
        run: agentic-job secure-host inference .agentic-job/config.toml
      - name: The host's configuration
        run: |
          install -D -m 0755 .agentic-job/agentic-job "$RUNNER_TEMP/agentic-job-bin/agentic-job"
          agentic-job config --host --from .agentic-job/config.toml --string "host.env.PATH=$RUNNER_TEMP/agentic-job-bin:/usr/local/bin:/usr/bin:/bin" > "$RUNNER_TEMP/agentic-job-host.toml"
      - uses: ./.agentic-job-source/secure-host
        with:
          config: ${{ runner.temp }}/agentic-job-host.toml
      - name: The setup script
        env:
          AGENT_HOME: ${{ runner.temp }}/agent-home
        run: python3 .agentic-job-source/workflow/runner-setup.py setup
      # What run/action.yml checks before it starts the agent; then that
      # the runner's user has lost sudo, and that the agentic-job its
      # commands find on the agent's PATH, the installed configuration's,
      # is the policy binary run starts, not the image's older copy.
      - name: The runner's user runs the policy binary on a secured host
        run: |
          python3 -c 'import sys, tomllib; c = tomllib.load(open("/etc/agentic-job/config.toml", "rb")); sys.exit(0 if c.get("host", c.get("sandbox", {})).get("lock-runner", True) is True else "run requires a locked host")'
          agentic-job sandbox check --unless-passed
          if sudo -n true 2> /dev/null; then echo "::error::the runner's user still has sudo"; exit 1; fi
          chmod 0755 .agentic-job/agentic-job
          path=$(python3 -c 'import tomllib; c = tomllib.load(open("/etc/agentic-job/config.toml", "rb")); print(c.get("host", c.get("sandbox", {}))["env"]["PATH"])')
          found=$(env -i PATH="$path" sh -c 'command -v agentic-job')
          echo "policy binary: $(.agentic-job/agentic-job --version); on the agent's PATH: $found, $("$found" --version)"
          cmp "$found" .agentic-job/agentic-job || { echo "::error::the agent's PATH finds $found, not the policy binary"; exit 1; }

  # The README's example: an untrusted job with nothing worth stealing,
  # whose output a second job takes by artifact ID and digest, as data.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      id: ${{ steps.up.outputs.artifact-id }}
      digest: ${{ steps.up.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      - run: just secure-host-root before
      - run: just secure-host-metadata before
      # A detached process of the runner's user holding a canary, bounded
      # even on failed jobs; it keeps RUNNER_TRACKING_ID for runner cleanup.
      - name: Another process's environment is readable before the action
        env:
          SECURE_HOST_READ_PROBE: not-a-secret
        run: |
          setsid /usr/bin/sleep 600 < /dev/null > /dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/secure-host-read-probe.pid"
          grep -qxzF SECURE_HOST_READ_PROBE=not-a-secret "/proc/$!/environ"
      - uses: ./secure-host
        with:
          egress: write-policy
      # What would be `make test`: steps of the runner's user, without root.
      - run: just secure-host-root after
      - run: just secure-host-metadata after
      # Setup's hidepid=invisible decides with the same check as the read, so
      # a refused process may be missing from /proc altogether. Alive around
      # the read, since any other failure proves nothing; left alive, as the
      # job's normal cleanup must work with the rule on.
      - name: Another process's environment is refused after the action
        run: |
          export LC_ALL=C
          pid=$(< "$RUNNER_TEMP/secure-host-read-probe.pid")
          if ! [[ "$pid" =~ ^[0-9]+$ ]] || [ "$pid" -le 1 ]; then echo "::error::invalid probe PID"; exit 1; fi
          kill -0 "$pid"
          if err=$(cat "/proc/$pid/environ" 2>&1 > /dev/null); then
            echo "::error::another runner process environment is still readable"; exit 1
          fi
          case "$err" in
            *": Permission denied" | *": No such file or directory") ;;
            *) echo "::error::unexpected: $err"; exit 1 ;;
          esac
          kill -0 "$pid"
      - run: just secure-host-egress
      - run: mkdir out && git rev-parse HEAD > out/commit
      - id: up
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # The artifact the build job named is the one it uploaded, by its
      # digest; download-artifact then refuses bytes that do not match it.
      - name: The artifact has the build job's digest
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.build.outputs.id }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          [[ "$ID" =~ ^[0-9]+$ && "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" --jq .digest)" = "sha256:$DIGEST"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.id }}
          path: out
      # Validated as data, never run.
      - name: Validate
        run: grep -qxE '[0-9a-f]{40}' out/commit

  # The inputs: a configuration of the caller's (here one that keeps the
  # runner's root, which shows it was taken) and no check.
  options:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      - run: just secure-host-options before
      - uses: ./secure-host
        with:
          config: ${{ runner.temp }}/unlocked.toml
          check: "false"
      - run: just secure-host-options after

  # The `egress-policy` input: the fixture's probe rule allows its POST and
  # no other, its git fetch rule keeps the action's check passing, and the
  # runner's own write endpoints still take an artifact.
  egress-policy:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      - uses: ./secure-host
        with:
          egress: write-policy
          egress-policy: secure-host/ci-egress-policy.toml
      - run: just secure-host-egress /secure-host-ci
      - run: mkdir out && git rev-parse HEAD > out/commit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egress-policy
          path: out/
          if-no-files-found: error

  # Failed setup can leave partial host changes: never reuse this VM for
  # another action invocation or untrusted work.
  invalid-egress-policy:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      - uses: ./secure-host
        id: invalid
        continue-on-error: true
        with:
          egress: write-policy
          egress-policy: secure-host/ci-invalid-egress-policy.toml
          check: "false"
      - name: Invalid policy fails setup without sandbox check
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: just secure-host-invalid-policy

  # The world-write policy from the caller's side, after the action exited.
  world-write:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      - run: just secure-host-world-write before
      - uses: ./secure-host
      - run: just secure-host-world-write after
