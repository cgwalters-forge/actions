# The one job named ci is what the main branch ruleset requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      # Relative links and anchors only: external sites make CI flaky.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress "**/*.md"
          fail: true
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12 -color
      # sandbox-share on this runner: content, a file and a directory are
      # shared root-owned and read-only, and a symlink is refused.
      - name: Make files to share
        run: |
          mkdir -p share-test/dir && echo one >share-test/dir/a && echo two >share-test/file
          ln -s /etc/shadow share-test/shadow
      - uses: ./sandbox-share
        with:
          name: greeting
          content: hello from ${{ github.job }}
      - uses: ./sandbox-share
        with:
          name: file
          path: share-test/file
      - uses: ./sandbox-share
        with:
          name: dir
          path: share-test/dir
      - id: share-symlink
        continue-on-error: true
        uses: ./sandbox-share
        with:
          name: shadow
          path: share-test/shadow
      - name: Check sandbox-share's result
        env:
          SYMLINK: ${{ steps.share-symlink.outcome }}
        run: node sandbox-share/check.mjs
