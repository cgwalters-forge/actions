# Composed from agentic-job's review.yml and agent.yml, at the commit the three
# pinned calls name: keep event policy and publication semantics there in sync
# when updating them. The register job is this file's, as the dispatch
# wrapper's is that file's; the agent job is cgwalters-agent.yml, shared with
# cgwalters-agentic-job.yml and called by local path, so at this file's commit.
# The agent is the runner's user, the only agent user since agentic-job#2989,
# with no identity token in its job. A comment review queued behind a running
# one holds its tailnet key, valid for an hour, while it waits: past that its
# agent job fails before the join, and so does re-running only a failed agent
# job, whose key the first attempt spent. Re-run all jobs.
# Optional review-history, failure-class/cost outputs, paced dispatches and
# approval carry-forward are not adopted by this event-only composition.
# They name the release's commit, not its tag, for the reason
# cgwalters-agentic-job.yml's header gives.
# No dispatcher inputs: identity/configuration comes from repository variables.
name: cgwalters-review
on:
  workflow_call:
    secrets:
      SAFE_OUTPUTS_PAT:
        required: false
permissions: {}
jobs:
  # The register job gets identity tokens with this file's
  # `job_workflow_ref`, which the broker and the tailnet admit: refuse an
  # owner not ours on a hosted runner first (admit/README.md). Everything
  # else needs policy.
  # Then the deployment's defaults (deployment/README.md), for policy.
  admit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      agent-model: ${{ steps.deployment.outputs.agent-model }}
    steps:
      - uses: cgwalters-forge/actions/admit@c9a9501729bc306f3efdc188056b51149c1c9398 # main
      - uses: cgwalters-forge/actions/deployment@c9a9501729bc306f3efdc188056b51149c1c9398 # main
        id: deployment

  policy:
    needs: admit
    # Untrusted authors must not drain the shared inference budget by opening
    # or reopening PRs. Otherwise-unassociated bots are off by default,
    # admitted by immutable id AND bounds. Preserve upstream's association
    # admission for all authors. /review requires write access in policy.
    # Never for a private repository, whatever its bounds say: agentic-job's
    # opt-in (its #739) would send its source through our shared inference
    # proxy and runners.
    if: >-
      github.event.repository.visibility == 'public' && (
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
          (github.event.pull_request.user.type == 'Bot' && startsWith(vars.REVIEW_BOT_IDS, '[') &&
            contains(fromJSON(vars.REVIEW_BOT_IDS || '[]'), github.event.pull_request.user.id)))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')))
    uses: cgwalters-forge/agentic-job/.github/workflows/policy.yml@427ce2295925654be9c35e91ca5cee91bbc2c9ea # build-e9bea055d71d86a461b8956e1e550398f8a8253d32539b253969bf6f17527a9d
    permissions:
      actions: read
      contents: read
    with:
      id: review-${{ github.event.pull_request.number || github.event.issue.number }}
      repo: ${{ github.repository }}
      event: true
      review: true
      review-task: workflow/review.md
      task: ''
      kind: analysis
      outputs: add_comment,noop
      max-outputs: '1'
      notify: none
      allow: ${{ github.event_name == 'issue_comment' && 'workflow/review-command.toml' || 'workflow/review.toml' }}
      config: ${{ vars.AGENT_CONFIG || '.agentic-job-source/.github/agentic-job/hosted.toml' }}
      agent: ${{ vars.AGENT || 'opencode' }}
      model: ${{ vars.AGENT_MODEL || needs.admit.outputs.agent-model }}
      # Repository names are configured by the owner, never dispatch inputs.
      agent-config-repo: ${{ (vars.AGENT == '' || vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_REPO || '' }}
      agent-config-path: ${{ (vars.AGENT == '' || vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_PATH || '' }}
      inference-url: ${{ vars.INFERENCE_URL || 'http://100.114.231.4:18080' }}
      inference-audience: ${{ vars.INFERENCE_AUDIENCE || 'praxis-credential-broker' }}
      max-requests: '150'
      budget: '500'
      timeout: '75'

  refusal:
    needs: policy
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.policy.outputs.admitted == 'false' && needs.policy.outputs.binary-artifact-id != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: agentic-job-status-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only the policy job's binary, never an agent-uploaded executable.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - name: Report the policy refusal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ github.event.pull_request.number || github.event.issue.number }}
          TEXT: ${{ needs.policy.outputs.refusal }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" status

  # The one job of the run with an identity token for the broker and the
  # tailnet, on a hosted runner where nothing of the agent's or the
  # target's runs. It is this file's, not a shared workflow's, because the
  # token's `job_workflow_ref` names the file that defines the job, and the
  # broker and the tailnet admit this one. It joins the tailnet, mints the
  # single-use ephemeral key the agent job joins with
  # (tailscale/README.md), and registers the run with the policy job's
  # binary. Both leave as plain job outputs, the one way GitHub passes a
  # value from a job (it drops a masked one), and reach the agent job only
  # as secrets of its call, masked in its log; step debug logging would
  # log them here, so minting and `register` both refuse it.
  register:
    needs: policy
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      run-token: ${{ steps.register.outputs.run-token }}
      tailnet-key: ${{ steps.tailnet.outputs.key }}
      # For the agent job's check of the key (cgwalters-agent.yml).
      tailnet-key-attempt: ${{ github.run_attempt }}
      tailnet-key-minted-at: ${{ steps.minted.outputs.at }}
    steps:
      # The binary and configuration this job runs are the policy call's
      # uploads of this run, from the repository the wrappers' policy
      # `uses:` names; empty IDs would make download-artifact take every
      # upload, the agent's included.
      - name: The policy call's source and uploads
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
          EXPECTED_REPOSITORY: cgwalters-forge/agentic-job
          BINARY: ${{ needs.policy.outputs.binary-artifact-id }}
          POLICY: ${{ needs.policy.outputs.policy-artifact-id }}
        run: |
          [[ "$SOURCE_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::the policy call is not $EXPECTED_REPOSITORY at a full commit"; exit 1; }
          [[ "$BINARY" =~ ^[1-9][0-9]*$ && "$POLICY" =~ ^[1-9][0-9]*$ ]] ||
            { echo '::error::register requires binary and policy upload IDs from policy'; exit 1; }
      # Before minting, so that the agent job's expiry check errs early.
      - name: The key's mint time
        id: minted
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      # Pinned, as in cgwalters-agent.yml: main must not change privileged
      # code behind a caller's reviewed wrapper pin. The calling
      # repository's tailnet login, for an organization tailnets.json
      # doesn't list; set, it replaces a listed one's too. Not
      # tailscale/github-action's usual TAILSCALE_* names, which an
      # organization may already set for an OAuth client of another use.
      - name: Join the tailnet and mint the agent job's key
        id: tailnet
        uses: cgwalters-forge/actions/tailscale@1e867fca30bbfd531021f760b72cc839a1b10739 # main
        with:
          hostname: agentic-job-${{ github.run_id }}-${{ github.run_attempt }}
          oauth-client-id: ${{ vars.AGENTIC_JOB_TAILSCALE_OAUTH_CLIENT_ID }}
          tags: ${{ vars.AGENTIC_JOB_TAILSCALE_TAGS }}
          mint: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }},${{ needs.policy.outputs.policy-artifact-id }}
          path: ${{ runner.temp }}/agentic-job
          merge-multiple: true
      - id: register
        name: Register the run at the inference proxy
        env:
          JOB_DIR: ${{ runner.temp }}/agentic-job
        run: |
          chmod +x "$JOB_DIR/agentic-job"
          "$JOB_DIR/agentic-job" register --config "$JOB_DIR/config.toml" --output "$GITHUB_OUTPUT"

  # The agent as the runner's user on the caller's AGENT_RUNNER, with the
  # register job's run token and key as secrets (cgwalters-agent.yml).
  agent:
    needs: [policy, register]
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    # Only admitted runs compete; comments cannot cancel an automatic review.
    concurrency:
      group: review-pull-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/cgwalters-agent.yml
    secrets:
      INFERENCE_RUN_TOKEN: ${{ needs.register.outputs.run-token }}
      TAILNET_KEY: ${{ needs.register.outputs.tailnet-key }}
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      runner: ${{ vars.AGENT_RUNNER || '"ubuntu-26.04"' }}
      tailnet-key-attempt: ${{ needs.register.outputs.tailnet-key-attempt }}
      tailnet-key-minted-at: ${{ needs.register.outputs.tailnet-key-minted-at }}
      github-reads: true

  check:
    needs: [policy, agent]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.agent.outputs.safe-outputs-artifact-id != '' }}
    # check.yml's detect job asks for it; only that job takes it (see
    # cgwalters-agentic-job.yml). `actions: read` is for the digest check.
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: cgwalters-forge/agentic-job/.github/workflows/check.yml@427ce2295925654be9c35e91ca5cee91bbc2c9ea # build-e9bea055d71d86a461b8956e1e550398f8a8253d32539b253969bf6f17527a9d
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.agent.outputs.safe-outputs-artifact-digest }}

  submit:
    needs: [policy, agent, check]
    if: >-
      ${{ !cancelled() && vars.AGENT_REAL_REVIEWS == 'true' && needs.policy.outputs.review-head != '' &&
          needs.policy.outputs.binary-artifact-id != '' &&
          needs.check.result == 'success' && needs.check.outputs.artifact-id != '' &&
          contains(fromJSON('["APPROVE", "CHANGES"]'), needs.check.outputs.verdict) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      review-url: ${{ steps.submit.outputs.review-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      # Only check's upload from this run, never an agent-uploaded verdict.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: ${{ runner.temp }}/checked
      - name: Submit the checked verdict at the admitted head
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          AGENT_EXIT: ${{ needs.agent.outputs.exit }}
          AGENT_JOB: ${{ needs.agent.outputs.job }}
          REAL_REVIEWS: ${{ vars.AGENT_REAL_REVIEWS }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" review submit --accepted "$RUNNER_TEMP/checked/agent_output.json" --output "$GITHUB_OUTPUT"

  apply:
    needs: [policy, agent, check, submit]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.submit.outputs.review-url == '' }}
    uses: cgwalters-forge/agentic-job/.github/workflows/apply.yml@427ce2295925654be9c35e91ca5cee91bbc2c9ea # build-e9bea055d71d86a461b8956e1e550398f8a8253d32539b253969bf6f17527a9d
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      agent: ${{ toJSON(needs.agent) }}
      check: ${{ toJSON(needs.check) }}

  status:
    needs: [policy, agent, check, submit, apply]
    if: ${{ !cancelled() && needs.policy.outputs.review-head != '' && needs.policy.outputs.binary-artifact-id != '' && needs.agent.result != 'cancelled' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - name: Report the compatibility status
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          APPLY_RESULT: ${{ needs.apply.result }}
          RESULT_URL: ${{ needs.apply.outputs.result-url }}
          REVIEW_URL: ${{ needs.submit.outputs.review-url }}
          REAL_REVIEWS: ${{ vars.AGENT_REAL_REVIEWS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" review status
