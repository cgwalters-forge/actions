# Composed from agentic-job v0.6.11's review.yml and agent.yml: keep event policy and
# publication semantics there in sync when updating the three pinned calls.
# Optional review-history, failure-class/cost outputs, paced dispatches and
# approval carry-forward are not adopted by this event-only composition.
# They name the release's commit, not its tag, for the reason
# cgwalters-agentic-job.yml's header gives.
# No dispatcher inputs: identity/configuration comes from repository variables.
name: cgwalters-review
on:
  workflow_call:
    secrets:
      SAFE_OUTPUTS_PAT:
        required: false
permissions: {}
jobs:
  # The agent job runs on the caller's AGENT_RUNNER, where a self-hosted
  # runner's owner could mint identity tokens with this file's
  # `job_workflow_ref` for any audience: refuse an owner not ours on a
  # hosted runner first (admit/README.md). Everything else needs policy.
  # Then the deployment's defaults (deployment/README.md), for policy.
  admit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      agent-model: ${{ steps.deployment.outputs.agent-model }}
    steps:
      - uses: cgwalters-forge/actions/admit@c9a9501729bc306f3efdc188056b51149c1c9398 # main
      - uses: cgwalters-forge/actions/deployment@c9a9501729bc306f3efdc188056b51149c1c9398 # main
        id: deployment

  policy:
    needs: admit
    # Untrusted authors must not drain the shared inference budget by opening
    # or reopening PRs. Otherwise-unassociated bots are off by default,
    # admitted by immutable id AND bounds. Preserve upstream's association
    # admission for all authors. /review requires write access in policy.
    # Never for a private repository, whatever its bounds say: agentic-job's
    # opt-in (its #739) would send its source through our shared inference
    # proxy and runners.
    if: >-
      github.event.repository.visibility == 'public' && (
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
          (github.event.pull_request.user.type == 'Bot' && startsWith(vars.REVIEW_BOT_IDS, '[') &&
            contains(fromJSON(vars.REVIEW_BOT_IDS || '[]'), github.event.pull_request.user.id)))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')))
    uses: cgwalters-forge/agentic-job/.github/workflows/policy.yml@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
    permissions:
      actions: read
      contents: read
    with:
      id: review-${{ github.event.pull_request.number || github.event.issue.number }}
      repo: ${{ github.repository }}
      event: true
      review: true
      review-task: workflow/review.md
      task: ''
      kind: analysis
      outputs: add_comment,noop
      max-outputs: '1'
      notify: none
      allow: ${{ github.event_name == 'issue_comment' && 'workflow/review-command.toml' || 'workflow/review.toml' }}
      config: ${{ vars.AGENT_CONFIG || '.agentic-job-source/.github/agentic-job/hosted.toml' }}
      agent: ${{ vars.AGENT || 'opencode' }}
      model: ${{ vars.AGENT_MODEL || needs.admit.outputs.agent-model }}
      # Repository names are configured by the owner, never dispatch inputs.
      agent-config-repo: ${{ (vars.AGENT == '' || vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_REPO || '' }}
      agent-config-path: ${{ (vars.AGENT == '' || vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_PATH || '' }}
      inference-url: ${{ vars.INFERENCE_URL || 'http://100.114.231.4:18080' }}
      inference-audience: ${{ vars.INFERENCE_AUDIENCE || 'praxis-credential-broker' }}
      max-requests: '150'
      budget: '500'
      timeout: '75'

  refusal:
    needs: policy
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.policy.outputs.admitted == 'false' && needs.policy.outputs.binary-artifact-id != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: agentic-job-status-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only the policy job's binary, never an agent-uploaded executable.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - name: Report the policy refusal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ github.event.pull_request.number || github.event.issue.number }}
          TEXT: ${{ needs.policy.outputs.refusal }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" status

  agent:
    needs: policy
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    # Only admitted runs compete; comments cannot cancel an automatic review.
    concurrency:
      group: review-pull-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ${{ fromJSON(vars.AGENT_RUNNER || '"ubuntu-26.04"') }}
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
    outputs:
      exit: ${{ steps.run.outputs.exit }}
      over-budget: ${{ steps.run.outputs.over-budget }}
      safe-outputs-artifact-id: ${{ steps.run.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ steps.run.outputs.safe-outputs-artifact-digest }}
      # Let the submitted review's footer link the agent job, not just the run.
      job: ${{ job.check_run_id }}
    steps:
      # The trusted base, never the head; source actions come from policy's pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false
      # Fail closed before running anything of the source: an empty output
      # would make checkout fall back to the calling repository or to the
      # default branch, unreleased code run as root here. The expected
      # repository is the one policy's `uses:` names (lint/tests/wrappers.rs).
      - name: The policy call's source repository
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
          EXPECTED_REPOSITORY: cgwalters-forge/agentic-job
        run: |
          echo "$SOURCE_REPOSITORY at $SOURCE_SHA"
          [[ "$SOURCE_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::the policy call is not $EXPECTED_REPOSITORY at a full commit"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          persist-credentials: false
      # The sandbox must execute run's policy binary, outside the workspace;
      # the image replaces /usr/local/bin. Only the binary is public.
      - name: Create the job directory
        run: install -d -m 0711 /var/tmp/agentic-job
      - uses: ./.agentic-job-source/prepare # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          job-dir: /var/tmp/agentic-job
          binary-artifact-id: ${{ needs.policy.outputs.binary-artifact-id }}
          policy-artifact-id: ${{ needs.policy.outputs.policy-artifact-id }}
      - name: Keep the job inputs private
        run: |
          chmod 0600 /var/tmp/agentic-job/*
          chmod 0755 /var/tmp/agentic-job/agentic-job
      # One privileged network step, before secure-host drops root. The
      # tailnet and broker must admit this wrapper's job_workflow_ref with
      # an owner id admit/owners.json lists. Pin our own actions too: main
      # must not change privileged code behind a caller's reviewed wrapper
      # pin. Renovate proposes updates to these commits (renovate.json).
      - name: Join the tailnet
        uses: cgwalters-forge/actions/tailscale@c9a9501729bc306f3efdc188056b51149c1c9398 # main
        with:
          hostname: agentic-job-${{ github.run_id }}-${{ github.run_attempt }}
          # As in cgwalters-agentic-job.yml: unset, tailnets.json's entry.
          oauth-client-id: ${{ vars.AGENTIC_JOB_TAILSCALE_OAUTH_CLIENT_ID }}
          tags: ${{ vars.AGENTIC_JOB_TAILSCALE_TAGS }}
      # Fail on a missing proxy route before setup, not in its sandbox probes.
      # This TCP check sends no credentials and skips fake/no-proxy runs.
      - name: Check inference proxy reachability
        run: agentic-job secure-host inference /var/tmp/agentic-job/config.toml
      # As agent.yml with agent-user: sandbox: retain setup.script for
      # the image to run as the second user.
      # The image's CLI predates policy's handback format; commands inside
      # the sandbox must find the same binary as run, not the image's copy.
      - name: The host's configuration
        run: agentic-job config --host --from /var/tmp/agentic-job/config.toml --string sandbox.env.PATH=/var/tmp/agentic-job:/usr/local/bin:/usr/bin:/bin > "$RUNNER_TEMP/agentic-job-host.toml"
      - uses: ./.agentic-job-source/secure-host # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          config: ${{ runner.temp }}/agentic-job-host.toml
      - id: run
        timeout-minutes: 340
        uses: ./.agentic-job-source/run # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          job-dir: /var/tmp/agentic-job
          agent-user: sandbox
          github-token: ${{ github.token }}

  check:
    needs: [policy, agent]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.agent.outputs.safe-outputs-artifact-id != '' }}
    # check.yml's detect job asks for it; only that job takes it (see
    # cgwalters-agentic-job.yml). `actions: read` is for the digest check.
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: cgwalters-forge/agentic-job/.github/workflows/check.yml@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.agent.outputs.safe-outputs-artifact-digest }}

  submit:
    needs: [policy, agent, check]
    if: >-
      ${{ !cancelled() && vars.AGENT_REAL_REVIEWS == 'true' && needs.policy.outputs.review-head != '' &&
          needs.policy.outputs.binary-artifact-id != '' &&
          needs.check.result == 'success' && needs.check.outputs.artifact-id != '' &&
          contains(fromJSON('["APPROVE", "CHANGES"]'), needs.check.outputs.verdict) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      review-url: ${{ steps.submit.outputs.review-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      # Only check's upload from this run, never an agent-uploaded verdict.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: ${{ runner.temp }}/checked
      - name: Submit the checked verdict at the admitted head
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          AGENT_EXIT: ${{ needs.agent.outputs.exit }}
          AGENT_JOB: ${{ needs.agent.outputs.job }}
          REAL_REVIEWS: ${{ vars.AGENT_REAL_REVIEWS }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" review submit --accepted "$RUNNER_TEMP/checked/agent_output.json" --output "$GITHUB_OUTPUT"

  apply:
    needs: [policy, agent, check, submit]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.submit.outputs.review-url == '' }}
    uses: cgwalters-forge/agentic-job/.github/workflows/apply.yml@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      agent: ${{ toJSON(needs.agent) }}
      check: ${{ toJSON(needs.check) }}

  status:
    needs: [policy, agent, check, submit, apply]
    if: ${{ !cancelled() && needs.policy.outputs.review-head != '' && needs.policy.outputs.binary-artifact-id != '' && needs.agent.result != 'cancelled' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - name: Report the compatibility status
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          APPLY_RESULT: ${{ needs.apply.result }}
          RESULT_URL: ${{ needs.apply.outputs.result-url }}
          REVIEW_URL: ${{ needs.submit.outputs.review-url }}
          REAL_REVIEWS: ${{ vars.AGENT_REAL_REVIEWS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" review status

  # Threat: prose embedded in an admitted PR must not obtain a verdict, a
  # write credential, or the expensive review's inference allocation. This
  # independent, default-off chain has no edge back into the main gate.
  prose-config:
    needs: policy
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      model: ${{ steps.config.outputs.model }}
      runner: ${{ steps.config.outputs.runner }}
      requests: ${{ steps.config.outputs.requests }}
      minutes: ${{ steps.config.outputs.minutes }}
      usd: ${{ steps.config.outputs.usd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false
      - name: Check trusted cheap-model deployment settings
        id: config
        env:
          REVIEW_PROSE: ${{ vars.REVIEW_PROSE }}
          INFERENCE_URL: ${{ vars.INFERENCE_URL }}
        run: node workflow/prose.mjs config

  prose-policy:
    needs: [policy, prose-config]
    if: ${{ needs.policy.outputs.admitted == 'true' && needs.prose-config.outputs.enabled == 'true' }}
    uses: cgwalters-forge/agentic-job/.github/workflows/policy.yml@eecc8c434e67a7607264ab3f7d90c88b6d02042a # v0.6.12
    permissions:
      contents: read
      actions: read
    with:
      id: prose-${{ github.event.pull_request.number || github.event.issue.number }}
      artifact-prefix: prose-
      repo: ${{ github.repository }}
      event: true
      review: true
      advisory: true
      review-task: workflow/prose.md
      task: ''
      kind: analysis
      outputs: add_comment,noop
      max-outputs: '1'
      notify: none
      apply-partial: false
      # All routing, dispatch, environment and proposal inputs remain empty.
      allow: ${{ github.event_name == 'issue_comment' && 'workflow/review-command.toml' || 'workflow/review.toml' }}
      config: .agentic-job-source/.github/agentic-job/hosted.toml
      agent: opencode
      model: ${{ needs.prose-config.outputs.model }}
      inference-url: ${{ vars.INFERENCE_URL }}
      inference-audience: ${{ vars.INFERENCE_AUDIENCE || 'praxis-credential-broker' }}
      max-requests: ${{ needs.prose-config.outputs.requests }}
      budget-usd: ${{ needs.prose-config.outputs.usd }}
      timeout: ${{ needs.prose-config.outputs.minutes }}

  # v0.6.12 removed the second user. Registration alone holds OIDC. The
  # separate runner-only agent gets only its capped expiring run token.
  prose-register:
    needs: prose-policy
    if: ${{ needs.prose-policy.outputs.admitted == 'true' && needs.prose-policy.outputs.binary-artifact-id != '' && needs.prose-policy.outputs.policy-artifact-id != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      run-token: ${{ steps.register.outputs.run-token }}
    steps:
      - uses: cgwalters-forge/actions/tailscale@c9a9501729bc306f3efdc188056b51149c1c9398 # main
        with:
          hostname: prose-register-${{ github.run_id }}-${{ github.run_attempt }}
          oauth-client-id: ${{ vars.AGENTIC_JOB_TAILSCALE_OAUTH_CLIENT_ID }}
          tags: ${{ vars.AGENTIC_JOB_TAILSCALE_TAGS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prose-policy.outputs.binary-artifact-id }},${{ needs.prose-policy.outputs.policy-artifact-id }}
          path: ${{ runner.temp }}/prose-register
          merge-multiple: true
      - name: Register the bounded advisory run
        id: register
        env:
          JOB_DIR: ${{ runner.temp }}/prose-register
        run: |
          chmod +x "$JOB_DIR/agentic-job"
          "$JOB_DIR/agentic-job" register --config "$JOB_DIR/config.toml" --output "$GITHUB_OUTPUT"

  prose-agent:
    needs: [prose-policy, prose-config, prose-register]
    if: ${{ needs.prose-policy.outputs.admitted == 'true' && needs.prose-register.result == 'success' }}
    concurrency:
      group: prose-pull-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    uses: ./.github/workflows/cgwalters-prose-agent.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    secrets:
      INFERENCE_RUN_TOKEN: ${{ needs.prose-register.outputs.run-token }}
    with:
      policy: ${{ toJSON(needs.prose-policy.outputs) }}
      runner: ${{ needs.prose-config.outputs.runner }}

  prose-check:
    needs: [prose-policy, prose-agent]
    if: ${{ !cancelled() && needs.prose-policy.result == 'success' && needs.prose-agent.outputs.safe-outputs-artifact-id != '' }}
    uses: cgwalters-forge/agentic-job/.github/workflows/check.yml@eecc8c434e67a7607264ab3f7d90c88b6d02042a # v0.6.12
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      policy: ${{ toJSON(needs.prose-policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.prose-agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.prose-agent.outputs.safe-outputs-artifact-digest }}

  prose-bounds:
    needs: [prose-policy, prose-check]
    if: ${{ !cancelled() && needs.prose-check.result == 'success' && needs.prose-check.outputs.artifact-id != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prose-policy.outputs.ref }}
          persist-credentials: false
      - name: Require check's same-run artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.prose-check.outputs.artifact-id }}
          DIGEST: ${{ needs.prose-check.outputs.artifact-digest }}
        run: |
          [[ "$ARTIFACT" =~ ^[1-9][0-9]*$ && "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT" |
            jq -e --arg digest "sha256:$DIGEST" --arg run "$GITHUB_RUN_ID" '.digest == $digest and (.workflow_run.id | tostring) == $run' > /dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prose-check.outputs.artifact-id }}
          path: checked
          digest-mismatch: error
      - name: Bound the accepted prose suggestions
        run: node workflow/prose.mjs check

  prose-apply:
    needs: [prose-policy, prose-agent, prose-check, prose-bounds]
    if: ${{ !cancelled() && needs.prose-agent.result == 'success' && needs.prose-agent.outputs.exit == '0' && needs.prose-check.result == 'success' && needs.prose-check.outputs.artifact-id != '' && needs.prose-bounds.result == 'success' }}
    concurrency:
      group: prose-publish-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    uses: cgwalters-forge/agentic-job/.github/workflows/apply.yml@eecc8c434e67a7607264ab3f7d90c88b6d02042a # v0.6.12
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    with:
      policy: ${{ toJSON(needs.prose-policy.outputs) }}
      agent: ${{ toJSON(needs.prose-agent) }}
      check: ${{ toJSON(needs.prose-check) }}
