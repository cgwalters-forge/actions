# Composed from agentic-job v0.6.3's review.yml: keep event policy and
# publication semantics there in sync when updating the three pinned calls.
# No dispatcher inputs: identity/configuration comes from repository variables.
name: cgwalters-review
on:
  workflow_call:
    secrets:
      SAFE_OUTPUTS_PAT:
        required: false
permissions: {}
jobs:
  policy:
    # Untrusted authors must not drain the shared inference budget by opening
    # or reopening PRs. Otherwise-unassociated bots are off by default,
    # admitted by immutable id AND bounds. Preserve upstream's association
    # admission for all authors. /review requires write access in policy.
    # Never for a private repository, whatever its bounds say: agentic-job's
    # opt-in (its #739) would send its source through our shared inference
    # proxy and runners.
    if: >-
      github.event.repository.visibility == 'public' && (
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
          (github.event.pull_request.user.type == 'Bot' && startsWith(vars.REVIEW_BOT_IDS, '[') &&
            contains(fromJSON(vars.REVIEW_BOT_IDS || '[]'), github.event.pull_request.user.id)))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')))
    uses: cgwalters-forge/agentic-job/.github/workflows/policy.yml@v0.6.3
    permissions:
      contents: read
    with:
      id: review-${{ github.event.pull_request.number || github.event.issue.number }}
      repo: ${{ github.repository }}
      event: true
      review: true
      review-task: workflow/review.md
      task: ''
      kind: analysis
      outputs: add_comment,noop
      max-outputs: '1'
      notify: none
      allow: ${{ github.event_name == 'issue_comment' && 'workflow/review-command.toml' || 'workflow/review.toml' }}
      config: ${{ vars.AGENT_CONFIG || '.agentic-job-source/.github/agentic-job/hosted.toml' }}
      agent: ${{ vars.AGENT || 'opencode' }}
      model: ${{ vars.AGENT_MODEL || 'praxis/gpt-6.1-sol' }}
      # Repository names are configured by the owner, never dispatch inputs.
      agent-config-repo: ${{ (vars.AGENT == '' || vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_REPO || '' }}
      agent-config-path: ${{ (vars.AGENT == '' || vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_PATH || '' }}
      inference-url: ${{ vars.INFERENCE_URL || 'http://100.114.231.4:18080' }}
      inference-audience: ${{ vars.INFERENCE_AUDIENCE || 'praxis-credential-broker' }}
      max-requests: '150'
      budget: '500'
      timeout: '75'

  refusal:
    needs: policy
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.policy.outputs.admitted == 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: agentic-job-status-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          sparse-checkout: workflow
          persist-credentials: false
      - name: Report the policy refusal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ github.event.pull_request.number || github.event.issue.number }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: node .agentic-job-source/workflow/review.cjs refusal

  # The agent's identity token is this job's; it names this file as its
  # job_workflow_ref, so the tailnet and the broker must admit it. This job
  # joins the tailnet, mints the agent job's key and registers the run, and
  # runs nothing of the agent's; cgwalters-agent.yml says why the agent job
  # cannot. Its outputs are read only by the agent's call, as secrets of that call.
  register:
    needs: policy
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      run-token: ${{ steps.register.outputs.run-token }}
      network-secret: ${{ steps.mint.outputs.secret }}
    steps:
      - name: The policy call's source repository and upload IDs
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
          BINARY: ${{ needs.policy.outputs.binary-artifact-id }}
          POLICY: ${{ needs.policy.outputs.policy-artifact-id }}
        run: |
          [[ "$SOURCE_REPOSITORY" == cgwalters-forge/agentic-job && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::the policy call is not cgwalters-forge/agentic-job at a full commit"; exit 1; }
          # Empty IDs would make download-artifact take every upload.
          [[ "$BINARY" =~ ^[1-9][0-9]*$ && "$POLICY" =~ ^[1-9][0-9]*$ ]] ||
            { echo '::error::register requires binary and policy upload IDs from policy'; exit 1; }
      # As `agentic-job register` refuses for the run token: with step debug
      # logging the runner logs each output it sets, the minted key too.
      - name: Refuse step debug logging
        run: |
          if test -n "${RUNNER_DEBUG-}"; then
            echo "::error::Refusing to mint the agent job's tailnet key with step debug logging on; re-run without it"
            exit 1
          fi
      - name: Join the tailnet
        uses: cgwalters-forge/actions/tailscale@d7bfa158217182d8c0b0b775189dcf91a6afcdde
        with:
          hostname: agentic-job-${{ github.run_id }}-${{ github.run_attempt }}-register
      # The key the Tailscale CLI makes from the identity token itself
      # (feature/identityfederation), with the client ID and tags of the
      # join's action at the same commit: single-use, ephemeral,
      # preauthorized, expiring in an hour. Not masked: GitHub drops a job
      # output holding a masked value, and none of it is printed.
      - name: Mint the agent job's key
        id: mint
        shell: python3 -I {0}
        env:
          TAILNETS: https://raw.githubusercontent.com/cgwalters-forge/actions/d7bfa158217182d8c0b0b775189dcf91a6afcdde/tailscale/tailnets.json
          OWNER: ${{ github.repository_owner }}
        run: |
          import json, os, urllib.parse, urllib.request

          def fetch(url, data=None, headers={}):
              request = urllib.request.Request(url, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          tailnet = fetch(os.environ["TAILNETS"])[os.environ["OWNER"]]
          client = tailnet["oauth-client-id"]
          audience = urllib.parse.quote(f"api.tailscale.com/{client}", safe="")
          jwt = fetch(f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience={audience}",
                      headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})["value"]
          form = {"grant_type": "authorization_code", "code": "", "client_id": client, "jwt": jwt}
          access = fetch("https://api.tailscale.com/api/v2/oauth/token-exchange",
                         urllib.parse.urlencode(form).encode(),
                         {"Content-Type": "application/x-www-form-urlencoded"})["access_token"]
          create = {"reusable": False, "ephemeral": True, "preauthorized": True,
                    "tags": tailnet["tags"].split(",")}
          body = {"capabilities": {"devices": {"create": create}}, "expirySeconds": 3600}
          key = fetch("https://api.tailscale.com/api/v2/tailnet/-/keys", json.dumps(body).encode(),
                      {"Authorization": f"Bearer {access}", "Content-Type": "application/json"})["key"]
          if not key.startswith("tskey-") or any(c.isspace() for c in key):
              raise SystemExit("Tailscale returned no auth key")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"secret={key}\n")
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }},${{ needs.policy.outputs.policy-artifact-id }}
          path: ${{ runner.temp }}/agentic-job
          merge-multiple: true
      - id: register
        name: Register the run at the inference proxy
        env:
          JOB_DIR: ${{ runner.temp }}/agentic-job
        run: |
          chmod +x "$JOB_DIR/agentic-job"
          "$JOB_DIR/agentic-job" register --config "$JOB_DIR/config.toml" --output "$GITHUB_OUTPUT"

  agent:
    needs: [policy, register]
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    # Only admitted runs compete; comments cannot cancel an automatic review.
    concurrency:
      group: review-pull-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/cgwalters-agent.yml # zizmor: ignore[self-repository] This file's own commit.
    secrets:
      INFERENCE_RUN_TOKEN: ${{ needs.register.outputs.run-token }}
      NETWORK_SECRET: ${{ needs.register.outputs.network-secret }}
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      runner: ${{ vars.AGENT_RUNNER || '"ubuntu-26.04"' }}
      hostname: agentic-job-${{ github.run_id }}-${{ github.run_attempt }}

  check:
    needs: [policy, agent]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.agent.outputs.safe-outputs-artifact-id != '' }}
    # check.yml's detect job asks for it; only that job takes it (see
    # cgwalters-agentic-job.yml). `actions: read` is for the digest check.
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: cgwalters-forge/agentic-job/.github/workflows/check.yml@v0.6.3
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.agent.outputs.safe-outputs-artifact-digest }}

  submit:
    needs: [policy, agent, check]
    if: >-
      ${{ !cancelled() && vars.AGENT_REAL_REVIEWS == 'true' && needs.policy.outputs.review-head != '' &&
          needs.check.result == 'success' && needs.check.outputs.artifact-id != '' &&
          contains(fromJSON('["APPROVE", "CHANGES"]'), needs.check.outputs.verdict) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      review-url: ${{ steps.submit.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          sparse-checkout: workflow/review.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Only check's upload from this run, never an agent-uploaded verdict.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: ${{ runner.temp }}/checked
      - name: Submit the checked verdict at the admitted head
        id: submit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          AGENT_EXIT: ${{ needs.agent.outputs.exit }}
          AGENT_JOB: ${{ needs.agent.outputs.job }}
          REAL_REVIEWS: ${{ vars.AGENT_REAL_REVIEWS }}
        with:
          result-encoding: string
          script: |
            const fs = require('node:fs');
            const { submitReview } = require(`${process.env.GITHUB_WORKSPACE}/.agentic-job-source/workflow/review.cjs`);
            const output = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/checked/agent_output.json`, 'utf8'));
            return await submitReview(process.env, output, github, core);

  apply:
    needs: [policy, agent, check, submit]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.submit.outputs.review-url == '' }}
    uses: cgwalters-forge/agentic-job/.github/workflows/apply.yml@v0.6.3
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      agent: ${{ toJSON(needs.agent) }}
      check: ${{ toJSON(needs.check) }}

  status:
    needs: [policy, agent, check, submit, apply]
    if: ${{ !cancelled() && needs.policy.outputs.review-head != '' && needs.agent.result != 'cancelled' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          sparse-checkout: workflow/review.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Report the compatibility status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          APPLY_RESULT: ${{ needs.apply.result }}
          RESULT_URL: ${{ needs.apply.outputs.result-url }}
          REVIEW_URL: ${{ needs.submit.outputs.review-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { reportStatus } = require(`${process.env.GITHUB_WORKSPACE}/.agentic-job-source/workflow/review.cjs`);
            await reportStatus(process.env, github, core);
