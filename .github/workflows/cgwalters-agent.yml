# The agent job of both wrappers, cgwalters-agentic-job.yml and
# cgwalters-review.yml, which call it by local path, so at their own
# commit. It is agentic-job's agent.yml (at the release the wrappers pin)
# with this deployment's tailnet join, in a file of its own for the same
# reason: the register job's run token and tailnet key arrive as secrets,
# which GitHub masks in every log of this job, and nothing but a call's
# `secrets:` can make another job's output one (agentic-job's
# docs/workflow.md, "The run token").
#
# The agent is the runner's user, as every step after secure-host is, the
# only agent user since agentic-job#2989. It can read whatever the job
# holds, so the job holds nothing but the run token, which is the agent's
# to use anyway, and the tailnet key, spent by the join before anything of
# the agent's runs. No `id-token`: with it, anything that became the
# runner's user could mint identity tokens for any audience; the register
# job, which has it, joined, minted the key and registered the run. No
# repository secret comes here: an inference key or MCP credential would
# need a second user, which `run` refuses.
# The independent prose job uses the same boundary but a preconnected runner
# and its own pinned advisory release. It never receives a tailnet key.
name: cgwalters-agent

on:
  workflow_call:
    inputs:
      prose:
        description: Run the independent advisory on a preconnected runner
        type: boolean
        default: false
      policy:
        description: >-
          `toJSON(needs.policy.outputs)` of the wrapper's policy.yml call: the caller's commit,
          the source of the binary and the trusted upload IDs
        type: string
        required: true
      runner:
        description: The runner the agent runs on, as JSON
        type: string
        required: true
      github-reads:
        description: Give the agent this job's own read-only GitHub token as GH_TOKEN
        type: boolean
        required: true
    secrets:
      # The register job's `agentic-job register` output: the broker's run
      # token, narrow, capped and expiring. Only `run` gets it.
      INFERENCE_RUN_TOKEN:
        required: true
      # The register job's single-use, ephemeral tailnet key
      # (tailscale/README.md), given to the join alone, which spends it.
      TAILNET_KEY:
        required: false
    outputs:
      exit:
        value: ${{ inputs.prose && jobs.prose.outputs.exit || jobs.agent.outputs.exit }}
      failure-class:
        value: ${{ jobs.agent.outputs.failure-class }}
      over-budget:
        value: ${{ jobs.agent.outputs.over-budget }}
      stopped-early:
        value: ${{ jobs.agent.outputs.stopped-early }}
      cost:
        value: ${{ jobs.agent.outputs.cost }}
      secret-at:
        value: ${{ jobs.agent.outputs.secret-at }}
      safe-outputs-artifact-id:
        value: ${{ inputs.prose && jobs.prose.outputs.safe-outputs-artifact-id || jobs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest:
        value: ${{ inputs.prose && jobs.prose.outputs.safe-outputs-artifact-digest || jobs.agent.outputs.safe-outputs-artifact-digest }}
      job:
        value: ${{ jobs.agent.outputs.job }}

permissions: {}

jobs:
  agent:
    if: ${{ !inputs.prose }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 360
    # Read only, and nothing more: `run` hands this job's token to the
    # agent for GitHub reads, and no check sees what it was granted.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      exit: ${{ steps.run.outputs.exit }}
      failure-class: ${{ steps.run.outputs.failure-class }}
      over-budget: ${{ steps.run.outputs.over-budget }}
      stopped-early: ${{ steps.run.outputs.stopped-early }}
      cost: ${{ steps.run.outputs.cost }}
      secret-at: ${{ steps.run.outputs.secret-at }}
      safe-outputs-artifact-id: ${{ steps.run.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ steps.run.outputs.safe-outputs-artifact-digest }}
      # This job's ID, for a review's footer to link.
      job: ${{ job.check_run_id }}
    steps:
      # The bootc-dev RHEL 10 runners lack what the steps below assume: git,
      # without which checkout falls back to the REST API and prepare sees
      # no commit; node, for the tailscale action; gh, from EPEL, for run's
      # public-repository check. And sudo's secure_path omits
      # /usr/local/bin, where prepare installs agentic-job; the link
      # dangles until it does. Elsewhere, Ubuntu included, nothing runs.
      - name: Install RHEL prerequisites
        env:
          OS_RELEASE: /etc/os-release
        run: |
          if ! test -r "$OS_RELEASE"; then exit 0; fi
          # shellcheck source=/dev/null
          release=$(. "$OS_RELEASE" && echo "${ID:-} ${VERSION_ID:-}")
          case "$release" in
            "rhel 10" | "rhel 10."*) ;;
            *) exit 0 ;;
          esac
          sudo dnf install -y git nodejs podman
          sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
          sudo dnf install -y gh
          sudo ln -sfn /usr/local/bin/agentic-job /usr/bin/agentic-job
      # The calling repository at the policy job's commit, for the setup
      # script the configuration names; never a pull request's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.policy).ref }}
          persist-credentials: false
      # Fail closed before running anything of the source: an empty output
      # would make checkout fall back to the calling repository or to the
      # default branch, unreleased code run as root here. The expected
      # repository is the one the wrappers' policy `uses:` names
      # (lint/tests/wrappers.rs).
      - name: The policy call's source repository
        env:
          SOURCE_REPOSITORY: ${{ fromJSON(inputs.policy).source-repository }}
          SOURCE_SHA: ${{ fromJSON(inputs.policy).source-sha }}
          EXPECTED_REPOSITORY: cgwalters-forge/agentic-job
        run: |
          echo "$SOURCE_REPOSITORY at $SOURCE_SHA"
          [[ "$SOURCE_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::the policy call is not $EXPECTED_REPOSITORY at a full commit"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(inputs.policy).source-repository }}
          ref: ${{ fromJSON(inputs.policy).source-sha }}
          path: .agentic-job-source
          persist-credentials: false
      - uses: ./.agentic-job-source/prepare # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          binary-artifact-id: ${{ fromJSON(inputs.policy).binary-artifact-id }}
          policy-artifact-id: ${{ fromJSON(inputs.policy).policy-artifact-id }}
      # agentic-job's own admission of a runner-user run, before anything
      # privileged of ours: a private caller or target, an api-key or MCP
      # configuration, and a session's listener are refused here.
      - name: Admit the runner-user configuration
        env:
          CALLER_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          AGENT_USER: runner
        run: python3 .agentic-job-source/workflow/runner-setup.py admit
      # Our one privileged network step, as root before anything of the
      # agent's is on the machine, with the register job's key, which the
      # join spends: whatever is still valid after secure-host is the
      # agent's. Pinned: main must not change privileged code behind a
      # caller's reviewed wrapper pin. Renovate moves it (renovate.json).
      - name: Join the tailnet
        uses: cgwalters-forge/actions/tailscale@e084c52a9aa07f1279182cfc738de68b96016278 # from main
        with:
          authkey: ${{ secrets.TAILNET_KEY }}
          hostname: agentic-job-${{ github.run_id }}-${{ github.run_attempt }}-agent
      # Fail on a missing proxy route before setup, not in its probes.
      # This TCP check sends no credentials.
      - name: Check inference proxy reachability
        run: agentic-job secure-host inference .agentic-job/config.toml
      # The policy job's configuration for the host, by its binary: a
      # host's file has no `setup.script`, which the runner's user runs
      # below, after secure-host (agentic-job#2989). The pinned image
      # installs its own, older agentic-job in /usr/local/bin, and the
      # agent's commands (`agentic-job handback ...`) must find the policy
      # binary that `run` starts instead: a copy of it, in a directory of
      # its own, first on the agent's PATH.
      - name: The host's configuration
        run: |
          install -D -m 0755 .agentic-job/agentic-job "$RUNNER_TEMP/agentic-job-bin/agentic-job"
          agentic-job config --host --from .agentic-job/config.toml --string "host.env.PATH=$RUNNER_TEMP/agentic-job-bin:/usr/local/bin:/usr/bin:/bin" > "$RUNNER_TEMP/agentic-job-host.toml"
      # Every mirror in the runner's apt-mirrors.txt (archive and security
      # alike) is an ubuntu.com name, so Canonical's DNS outage of 2026-11-11
      # failed secure-host's package install on every run
      # (agentic-job#3419). These mirror the same signed archive, which apt
      # still checks against the Ubuntu keys, outside Canonical's DNS: Azure's
      # own load balancer behind azure.archive.ubuntu.com (Azure DNS,
      # http only), Princeton, kernel.org and Waterloo. At lower priorities
      # apt tries them only after the runner's own mirrors. On resolute that
      # covers arm64 too; RHEL hosts have no mirror list, so nothing changes.
      - name: Add last-resort Ubuntu mirrors
        run: |
          list=/etc/apt/apt-mirrors.txt
          if [ -f "$list" ] && grep -qE '^https?://(archive|security)\.ubuntu\.com/ubuntu' "$list" &&
            ! grep -q 'mirrors\.edge\.kernel\.org' "$list"; then
            printf '%s\tpriority:%s\n' \
              http://cloud-mirror-lb.eastus.cloudapp.azure.com/ubuntu/ 4 \
              https://mirror.math.princeton.edu/pub/ubuntu/ 5 \
              https://mirrors.edge.kernel.org/ubuntu/ 6 \
              https://mirror.csclub.uwaterloo.ca/ubuntu/ 7 | sudo tee -a "$list" >/dev/null
          fi
      - uses: ./.agentic-job-source/secure-host # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          config: ${{ runner.temp }}/agentic-job-host.toml
      # The configuration's `setup.script`, the caller's, for a toolchain:
      # as the runner's user, the agent's, without root, in the agent's
      # home and with its variables.
      - name: The setup script
        env:
          AGENT_HOME: ${{ runner.temp }}/agent-home
        run: python3 .agentic-job-source/workflow/runner-setup.py setup
      # Head code can exfiltrate even a read-only token: a review gets none
      # from the dispatch wrapper; pinned run fetches its head only as data.
      - id: run
        timeout-minutes: 340
        uses: ./.agentic-job-source/run # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          runner-home: ${{ runner.temp }}/agent-home
          github-token: ${{ inputs.github-reads && github.token || '' }}
          inference-run-token: ${{ secrets.INFERENCE_RUN_TOKEN }}

  # Keep the advisory's token, caps and runner independent of the main agent.
  # Like that job, all source is base-owned or policy-pinned, never head code.
  prose:
    if: ${{ inputs.prose }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      exit: ${{ steps.run.outputs.exit }}
      safe-outputs-artifact-id: ${{ steps.run.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ steps.run.outputs.safe-outputs-artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.policy).ref }}
          persist-credentials: false
      - name: Require the advisory release and trusted uploads
        env:
          POLICY: ${{ inputs.policy }}
        run: >-
          jq -e '."source-repository" == "cgwalters-forge/agentic-job" and
          ."source-sha" == "eecc8c434e67a7607264ab3f7d90c88b6d02042a" and
          ([."binary-artifact-id", ."policy-artifact-id"] | all(test("^[1-9][0-9]*$")))'
          <<< "$POLICY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/agentic-job
          ref: eecc8c434e67a7607264ab3f7d90c88b6d02042a # v0.6.12
          path: .agentic-job-source
          persist-credentials: false
      - uses: ./.agentic-job-source/prepare # zizmor: ignore[self-repository] Validated immutable policy source, never head code.
        with:
          binary-artifact-id: ${{ fromJSON(inputs.policy).binary-artifact-id }}
          policy-artifact-id: ${{ fromJSON(inputs.policy).policy-artifact-id }}
      - name: Admit the runner-only configuration
        env:
          CALLER_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          AGENT_USER: runner
        run: python3 .agentic-job-source/workflow/runner-setup.py admit
      - name: Prepare bounded prose and pinned checklist
        id: prose
        env:
          GH_TOKEN: ${{ github.token }}
        run: node workflow/prose.mjs
      - name: Check inference reachability
        if: steps.prose.outputs.ready == 'true'
        run: agentic-job secure-host inference .agentic-job/config.toml
      - name: The runner-only host configuration
        if: steps.prose.outputs.ready == 'true'
        run: agentic-job config --host --from .agentic-job/config.toml > "$RUNNER_TEMP/agentic-job-host.toml"
      - if: steps.prose.outputs.ready == 'true'
        uses: ./.agentic-job-source/secure-host # zizmor: ignore[self-repository] Validated immutable policy source, never head code.
        with:
          config: ${{ runner.temp }}/agentic-job-host.toml
      - name: The unprivileged setup script
        if: steps.prose.outputs.ready == 'true'
        env:
          AGENT_HOME: ${{ runner.temp }}/agent-home
        run: python3 .agentic-job-source/workflow/runner-setup.py setup
      - id: run
        if: steps.prose.outputs.ready == 'true'
        timeout-minutes: 6
        uses: ./.agentic-job-source/run # zizmor: ignore[self-repository] Validated immutable policy source, never head code.
        with:
          runner-home: ${{ format('{0}/agent-home', runner.temp) }}
          github-token: ${{ github.token }}
          inference-run-token: ${{ secrets.INFERENCE_RUN_TOKEN }}
